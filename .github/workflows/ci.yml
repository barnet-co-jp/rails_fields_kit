name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Run StandardRB
        run: bundle exec standardrb

  rspec:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Run RSpec
        run: bundle exec rspec

  rails_matrix:
    name: Rails compatibility (Rails ${{ matrix.rails }}, Ruby ${{ matrix.ruby-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - rails: "7.0"
            ruby-version: "3.1"
            gemfile: gemfiles/rails_7_0.gemfile
          - rails: "8.0"
            ruby-version: "3.3"
            gemfile: gemfiles/rails_8_0.gemfile
    env:
      BUNDLE_GEMFILE: ${{ matrix.gemfile }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby-version }}
          bundler-cache: true

      - name: Run representative RSpec suite
        run: bundle exec rspec

      - name: Build representative gem package
        run: bundle exec rake build

  javascript:
    name: JavaScript (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ["22", "24"]

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}

      - name: Check JavaScript syntax
        run: npm run check:js

  gem_package:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Build gem package
        run: gem build rails_fields_kit.gemspec

      - name: Verify packaged JavaScript exports
        run: ruby scripts/check_gem_package_exports.rb rails_fields_kit-*.gem

      - name: Install built gem
        run: gem install rails_fields_kit-*.gem

      - name: Verify gem can be required
        run: ruby -e "require 'rails_fields_kit'"
